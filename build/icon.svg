<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon: the 824px body sits on Apple's icon grid so it matches other apps' size in the Dock. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#346852" />
      <stop offset="1" stop-color="#2A5443" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#face)" filter="url(#shadow)" />
  <circle cx="512" cy="512" r="206" fill="none" stroke="#F6F4EF" stroke-width="49" />
  <circle cx="512" cy="512" r="74" fill="#F6F4EF" />
</svg>
